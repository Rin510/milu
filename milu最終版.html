<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Milu咪路</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* ===== 主題 ===== */
:root{--ink:#3d3530;--paper:#f2ede8;--sb:#faf7f4;--acc:#8b7355;--accL:#d4c4b0;--sage:#7a8f7e;--sageL:#dde8df;--bdr:#ddd6cc;--card:#fff;--hbg:#3d3530;--htx:#f2ede8;--mut:#a09080;}
body.th-greige {--ink:#3a3830;--paper:#f4f2ee;--sb:#f9f8f5;--acc:#909088;--accL:#d8d6d0;--sage:#a0a098;--sageL:#e4e4e0;--bdr:#dddbd4;--card:#fff;--hbg:#3a3830;--htx:#f4f2ee;--mut:#a0a098;}
body.th-calico {--ink:#3a2a1a;--paper:#fdf5ea;--sb:#fff9f0;--acc:#c07030;--accL:#f0c898;--sage:#8a7050;--sageL:#f0e8d8;--bdr:#e8d8c0;--card:#fff;--hbg:#3a2a1a;--htx:#fdf5ea;--mut:#a08060;}
body.th-morandi{--ink:#3d3028;--paper:#fdf9f5;--sb:#fff;--acc:#c8a888;--accL:#F1E3D3;--sage:#a89878;--sageL:#f5ede4;--bdr:#e0d0c0;--card:#fff;--hbg:#3d3028;--htx:#fdf9f5;--mut:#a89880;}
body.th-blue   {--ink:#263448;--paper:#f0f4fa;--sb:#f8fafd;--acc:#7aaac8;--accL:#c0d8ec;--sage:#8098b8;--sageL:#dce8f4;--bdr:#b8cce0;--card:#fff;--hbg:#263448;--htx:#f0f4fa;--mut:#7890a8;}
body.th-green  {--ink:#283830;--paper:#f0faf6;--sb:#f8fdfa;--acc:#8DBFAA;--accL:#c4e4d8;--sage:#70a890;--sageL:#d8f0e8;--bdr:#b0d8c8;--card:#fff;--hbg:#283830;--htx:#f0faf6;--mut:#70a088;}
body.th-purple {--ink:#302840;--paper:#f8f5ff;--sb:#fdf9ff;--acc:#BEB6D9;--accL:#dcd8f0;--sage:#a098c0;--sageL:#eeeaf8;--bdr:#d4cce8;--card:#fff;--hbg:#302840;--htx:#f8f5ff;--mut:#9890b8;}
body.th-rose   {--ink:#5a3040;--paper:#fef4f6;--sb:#fff8fa;--acc:#E0A4AF;--accL:#f4d0d8;--sage:#c8a8b0;--sageL:#fce8ec;--bdr:#f0d0d8;--card:#fff;--hbg:#5a3040;--htx:#fef4f6;--mut:#c0a0a8;}
body.th-sand   {--ink:#381808;--paper:#fdf2ec;--sb:#fff9f6;--acc:#c05840;--accL:#e8c8b0;--sage:#984030;--sageL:#f4dcd0;--bdr:#e0b8a8;--card:#fff;--hbg:#381808;--htx:#fdf2ec;--mut:#984030;}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Noto Sans TC',sans-serif;font-weight:400;background:var(--paper);color:var(--ink);min-height:100vh;}


/* ===== 標籤系統 ===== */
.tag-filter-wrap{padding:10px 12px 6px;border-bottom:1.5px solid var(--bdr);background:var(--card);flex-shrink:0;}
.tag-filter-title{font-size:.68rem;color:var(--mut);letter-spacing:.06em;margin-bottom:6px;}
.tag-filter-row{display:flex;flex-wrap:nowrap;gap:4px;margin-bottom:5px;overflow-x:auto;scrollbar-width:none;}
.tag-filter-btn{border:1.5px solid var(--bdr);border-radius:20px;padding:3px 9px;font-size:.7rem;font-family:inherit;background:var(--paper);color:var(--mut);cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0;}
.tag-filter-btn.active{background:var(--acc);border-color:var(--acc);color:#fff;}
.tag-filter-btn.all.active{background:var(--acc);border-color:var(--acc);color:#fff;}

.spot-tags{display:flex;flex-wrap:nowrap;gap:4px;margin-top:4px;overflow-x:auto;scrollbar-width:none;min-width:0;max-width:100%;}
.spot-tags::-webkit-scrollbar{display:none;}
.spot-tag{border:1.5px solid var(--accL);border-radius:20px;padding:1px 8px;font-size:.65rem;color:var(--acc);background:transparent;cursor:pointer;transition:all .15s;white-space:nowrap;}
.spot-tag:hover{background:var(--accL);}
.spot-tag.del-mode{border-color:#e0c0c0;color:#c0392b;}
.spot-tag.del-mode:hover{background:#f8e8e8;}

.tag-editor{padding:8px 10px;background:#fff;border-radius:0 0 9px 9px;border:1.5px solid var(--bdr);border-top:none;width:100%;box-sizing:border-box;}
.tag-editor-title{font-size:.68rem;color:var(--mut);margin-bottom:6px;}
.tag-preset-row{display:flex;flex-wrap:wrap;gap:4px;width:100%;}
.tag-preset-btn{border:1.5px solid var(--bdr);border-radius:20px;padding:3px 9px;font-size:.7rem;font-family:inherit;background:#fff;color:var(--mut);cursor:pointer;transition:all .15s;}
.tag-preset-btn.selected{background:var(--acc);border-color:var(--acc);color:#fff;}

/* ===== Loading ===== */
#loadingScreen{position:fixed;inset:0;background:var(--paper);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .5s;}
#loadingScreen.hide{opacity:0;pointer-events:none;}
.paw-anim{font-size:2.8rem;animation:pawBounce .9s infinite alternate;}
@keyframes pawBounce{from{transform:scale(1) rotate(-8deg);}to{transform:scale(1.25) rotate(8deg);}}

/* ===== 按鈕 ===== */
.btn{border:none;border-radius:9px;padding:9px 15px;font-size:.82rem;font-family:inherit;font-weight:400;cursor:pointer;transition:all .18s;white-space:nowrap;}
.btn-primary{background:var(--acc);color:#fff;}.btn-primary:hover{filter:brightness(1.08);}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;}
.btn-secondary{background:var(--sageL);color:var(--sage);}
.btn-ghost{background:transparent;border:1.5px solid var(--bdr);color:var(--mut);}
.btn-ghost:hover{border-color:var(--acc);color:var(--acc);}
.btn-danger{background:#f8e8e8;color:#c0392b;border:1.5px solid #e0c0c0;}
.btn-sm{padding:5px 10px;font-size:.75rem;border-radius:7px;}
.btn-full{width:100%;padding:11px;}

/* ===== 覆層 ===== */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:2000;display:none;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;}
.overlay.open{display:flex;}
.dlg{background:var(--card);border-radius:18px;padding:20px;width:100%;max-width:360px;box-shadow:0 8px 32px rgba(0,0,0,.18);max-height:90vh;overflow-y:auto;box-sizing:border-box;}
.dlg h3{font-size:.95rem;font-weight:700;margin-bottom:8px;}
.dlg p{font-size:.75rem;color:var(--mut);margin-bottom:10px;line-height:1.6;}
.dlg-btns{display:flex;gap:8px;margin-top:12px;}
.dlg-btns .btn{flex:1;padding:10px;}
.field{width:100%;border:1.5px solid var(--bdr);border-radius:9px;padding:9px 12px;font-size:.85rem;font-family:inherit;outline:none;background:var(--paper);color:var(--ink);transition:border-color .2s;margin-bottom:8px;}
.field:focus{border-color:var(--acc);}
.field::placeholder{color:var(--accL);}
.field-label{font-size:.7rem;color:var(--mut);margin-bottom:3px;display:block;}

/* ===== Toast ===== */
.toast{position:fixed;bottom:24px;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(120px);background:var(--ink);color:var(--paper);padding:10px 20px;border-radius:30px;font-size:.78rem;z-index:9999;transition:transform .3s;max-width:88vw;text-align:center;pointer-events:none;}
.toast.show{transform:translateX(-50%) translateY(0);}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:4px;}
@keyframes spin{to{transform:rotate(360deg)}}
.star{font-size:1.3rem;cursor:pointer;color:#ddd;transition:color .15s;user-select:none;}
.star.on{color:#f0c040;}
.star-row{display:flex;gap:3px;}

/* ===== Pages ===== */
.page{display:none;min-height:100vh;}
.page.active{display:block;}

/* ===== 首頁 ===== */
.home-header{background:var(--hbg);color:var(--htx);padding:0 16px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;gap:10px;}
.home-logo{font-size:1rem;font-weight:700;white-space:nowrap;flex-shrink:0;}
.theme-dots-row{display:flex;gap:6px;flex-shrink:0;}
.theme-dot-btn{width:18px;height:18px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:all .15s;flex-shrink:0;}
.theme-dot-btn.active{border-color:var(--htx);transform:scale(1.2);}
.home-body{padding:16px;max-width:800px;margin:0 auto;}
.home-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.home-top h2{font-size:.95rem;font-weight:700;}
.project-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}
.project-card{background:var(--card);border:1.5px solid var(--bdr);border-radius:14px;overflow:hidden;transition:all .2s;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.project-card:hover{transform:translateY(-2px);box-shadow:0 5px 18px rgba(0,0,0,.11);}
.project-cover{width:100%;height:120px;background:var(--sageL);display:flex;align-items:center;justify-content:center;font-size:2.2rem;overflow:hidden;cursor:pointer;}
.project-cover img{width:100%;height:100%;object-fit:cover;}
.project-card-body{padding:10px 13px;cursor:pointer;}
.project-card-name{font-size:.88rem;font-weight:700;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.project-card-meta{font-size:.7rem;color:var(--mut);}
.project-card-actions{display:flex;gap:6px;padding:0 13px 10px;}
.empty-home{text-align:center;padding:50px 20px;color:var(--mut);grid-column:1/-1;}
.empty-home .icon{font-size:2.8rem;margin-bottom:12px;}

/* ===== 編輯頁 ===== */
#editPage{display:none;}
#editPage.active{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.edit-header{background:var(--hbg);color:var(--htx);height:52px;padding:0 12px;display:flex;align-items:center;gap:8px;flex-shrink:0;z-index:100;}
.back-btn{background:rgba(255,255,255,.13);border:none;color:var(--htx);border-radius:7px;padding:5px 10px;font-size:.75rem;cursor:pointer;font-family:inherit;flex-shrink:0;}
.edit-proj-name{flex:1;min-width:0;cursor:pointer;padding:4px 7px;border-radius:6px;font-size:.85rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--htx);}
.edit-proj-name:hover{background:rgba(255,255,255,.12);}
.hdr-right{display:flex;align-items:center;gap:5px;flex-shrink:0;}
.theme-btn{background:rgba(255,255,255,.13);border:none;color:var(--htx);border-radius:7px;padding:5px 8px;font-size:.72rem;cursor:pointer;font-family:inherit;}
.mode-badge{background:var(--sage);color:#fff;font-size:.6rem;padding:3px 7px;border-radius:20px;white-space:nowrap;}

/* 編輯主體 */
.edit-body{display:grid;grid-template-columns:380px 1fr;flex:1;overflow:hidden;min-height:0;}

/* ===== 左側 Panel（含 tabs）===== */
.left-panel{display:flex;flex-direction:column;overflow:hidden;background:var(--sb);border-right:1.5px solid var(--bdr);min-height:0;}

/* 左側 tabs（收藏窩 / 巡邏天數）*/
.panel-tabs{display:flex;flex-shrink:0;border-bottom:1.5px solid var(--bdr);background:var(--card);}
.panel-tab{flex:1;padding:10px;text-align:center;font-size:.78rem;font-weight:500;cursor:pointer;border:none;background:transparent;font-family:inherit;color:var(--mut);border-bottom:2.5px solid transparent;transition:all .15s;}
.panel-tab.active{color:var(--acc);border-bottom-color:var(--acc);}
.tab-icon{display:inline-block;width:1em;height:1em;fill:currentColor;vertical-align:-0.15em;flex-shrink:0;}

/* 收藏窩面板 */
.pool-panel{display:none;flex-direction:column;flex:1;overflow:hidden;min-height:0;}
.pool-panel.active{display:flex;}
.pool-add{padding:12px 13px;border-bottom:1.5px solid var(--bdr);background:var(--card);flex-shrink:0;}
.sec-title{font-size:.68rem;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;margin-bottom:7px;}
.coord-row{display:flex;gap:5px;}
.coord-row .field{flex:1;margin-bottom:0;}
.input-hint{font-size:.65rem;color:var(--mut);line-height:1.6;margin-top:4px;}
.input-hint a{color:var(--acc);}
.pool-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px;}

/* 收藏窩卡片 */
.pool-card{background:var(--card);border:1.5px solid var(--bdr);border-radius:11px;margin-bottom:7px;display:flex;flex-direction:column;animation:slideIn .2s ease;min-width:0;overflow:hidden;}
.pool-card-main{display:flex;align-items:flex-start;gap:8px;padding:9px 11px;}
.pool-card-info{flex:1;min-width:0;overflow:hidden;width:0;}
.pool-card-name{font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pool-card-coord{font-size:.65rem;color:var(--mut);margin-top:2px;}
.pool-card-btns{display:flex;gap:3px;flex-shrink:0;}
.pool-icon{flex-shrink:0;}
.assign-btn{background:var(--acc);color:#fff;border:none;border-radius:7px;padding:4px 9px;font-size:.72rem;cursor:pointer;font-family:inherit;white-space:nowrap;}
.assign-btn:hover{filter:brightness(1.08);}

/* 天數面板 */
.days-panel{display:none;flex-direction:column;flex:1;overflow:hidden;min-height:0;}
.days-panel.active{display:flex;}

/* 天數 tabs — 固定高度橫向滾動 */
.days-tabs-wrap{flex-shrink:0;background:var(--sb);border-bottom:1.5px solid var(--bdr);padding:8px 12px 0;min-height:50px;}
.days-scroll{display:flex;gap:4px;overflow-x:scroll;min-height:42px;align-items:flex-end;-webkit-overflow-scrolling:touch;scrollbar-width:thin;padding-bottom:0;}
.days-scroll::-webkit-scrollbar{height:3px;}.days-scroll::-webkit-scrollbar-thumb{background:var(--accL);border-radius:2px;}
.day-tab{flex-shrink:0;padding:5px 10px 7px;border-radius:8px 8px 0 0;font-size:.73rem;border:1.5px solid var(--bdr);border-bottom:none;background:var(--paper);color:var(--mut);cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;-webkit-user-select:none;user-select:none;}
.day-tab.active{background:var(--acc);color:#fff;border-color:var(--acc);}
.day-tab-count{font-size:.58rem;opacity:.7;}
.day-tab-del{background:none;border:none;cursor:pointer;font-size:.62rem;opacity:.55;padding:0;line-height:1;color:inherit;}
.day-tab-add{flex-shrink:0;padding:5px 10px 7px;border-radius:8px 8px 0 0;font-size:.8rem;cursor:pointer;border:1.5px dashed var(--accL);border-bottom:none;background:transparent;color:var(--acc);font-family:inherit;-webkit-user-select:none;user-select:none;}

/* 景點清單 */
.spots-wrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px;}
.spots-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;}
.spots-hdr-l{display:flex;align-items:center;gap:6px;}
.day-name-label{font-size:.88rem;font-weight:700;}
.spot-count{background:var(--acc);color:#fff;border-radius:20px;padding:2px 8px;font-size:.63rem;}
.drag-hint{font-size:.6rem;color:var(--mut);}

/* 景點卡 */
.spot-card{background:var(--card);border:1.5px solid var(--bdr);border-radius:12px;margin-bottom:0;overflow:hidden;animation:slideIn .2s ease;transition:border-color .2s;}
.spot-card.dragging{opacity:.35;}
.spot-card.drag-over{border-color:var(--acc);box-shadow:0 0 0 3px rgba(139,115,85,.1);}
.spot-card.highlighted{border-color:var(--acc);}
@keyframes slideIn{from{transform:translateY(-4px)}to{transform:translateY(0)}}

/* 景點主列 */
.spot-main{display:flex;align-items:center;gap:6px;padding:8px 10px;}
.drag-hdl{color:var(--bdr);font-size:.9rem;cursor:grab;flex-shrink:0;user-select:none;touch-action:none;margin-top:3px;}
.spot-num{width:24px;height:24px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:700;flex-shrink:0;margin-top:2px;}
.spot-info{flex:1;min-width:0;}

/* 鉛筆和名稱固定在同一行 */
.spot-name-row{display:flex;align-items:center;gap:3px;min-width:0;flex-wrap:nowrap;}
.spot-name{font-size:.83rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
.spot-edit-btn{background:none;border:none;cursor:pointer;color:var(--mut);font-size:.75rem;opacity:.36;padding:4px;flex-shrink:0;line-height:1;display:inline-flex;align-items:center;}
.spot-edit-btn:hover{opacity:1;}
.spot-time-disp{font-size:.65rem;color:var(--acc);margin-top:2px;}
.ibtns{display:flex;gap:2px;flex-shrink:0;align-items:center;}
.ibtn{background:none;border:none;cursor:pointer;padding:4px;font-size:.82rem;opacity:.36;transition:opacity .2s;line-height:1;color:var(--mut);}
.ibtn:hover{opacity:1;}

/* 景點間距離顯示 */
.leg-info{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 42px;font-size:.68rem;color:var(--mut);}
.leg-line{flex:1;border-top:1.5px dashed var(--bdr);}
.leg-text{white-space:nowrap;font-size:.67rem;color:var(--mut);flex-shrink:0;}

/* 展開區 */
.spot-expand{border-top:1px solid var(--bdr);padding:9px 11px;display:none;background:var(--paper);}
.spot-expand.open{display:block;}
.exp-tabs{display:flex;margin-bottom:9px;border:1.5px solid var(--bdr);border-radius:8px;overflow:hidden;}
.exp-tab{flex:1;text-align:center;padding:6px;font-size:.7rem;cursor:pointer;background:var(--paper);color:var(--mut);border:none;font-family:inherit;transition:all .15s;}
.exp-tab.active{background:var(--acc);color:#fff;}
.exp-panel{display:none;}
.exp-panel.active{display:block;}
.exp-row{display:flex;gap:5px;align-items:center;margin-bottom:6px;}
.exp-lbl{font-size:.65rem;color:var(--mut);flex-shrink:0;width:32px;}
.trow{display:flex;align-items:center;gap:4px;flex:1;}
.time-f{flex:1;border:1.5px solid var(--bdr);border-radius:8px;padding:6px 7px;font-size:.76rem;font-family:inherit;outline:none;background:var(--card);color:var(--ink);}
.time-f:focus{border-color:var(--acc);}
.tsep{font-size:.7rem;color:var(--mut);}
.note-f{width:100%;display:block;border:1.5px solid var(--bdr);border-radius:8px;padding:7px 9px;font-size:.75rem;font-family:inherit;resize:vertical;min-height:58px;outline:none;background:var(--card);color:var(--ink);}
.note-f:focus{border-color:var(--acc);}
.diary-photos{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.diary-photo-wrap{position:relative;width:64px;height:64px;}
.diary-photo{width:64px;height:64px;border-radius:8px;object-fit:cover;border:1.5px solid var(--bdr);cursor:pointer;display:block;}
.diary-photo-del{position:absolute;top:-4px;right:-4px;background:#fff;border:1px solid #ddd;border-radius:50%;width:15px;height:15px;font-size:.5rem;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#c0392b;}
.diary-photo-add{width:64px;height:64px;border-radius:8px;border:2px dashed var(--bdr);display:flex;align-items:center;justify-content:center;font-size:1.2rem;cursor:pointer;color:var(--mut);background:var(--paper);}
.diary-photo-add:hover{border-color:var(--acc);}
.diary-rating-row{display:flex;align-items:center;gap:7px;margin-bottom:6px;font-size:.68rem;color:var(--mut);}
.diary-text{width:100%;display:block;border:1.5px solid var(--bdr);border-radius:8px;padding:7px 9px;font-size:.75rem;font-family:inherit;resize:vertical;min-height:58px;outline:none;background:var(--card);color:var(--ink);}
.diary-text:focus{border-color:var(--acc);}

/* 底部 */
.actions{padding:9px 12px;border-top:1.5px solid var(--bdr);flex-shrink:0;background:var(--card);display:flex;flex-direction:column;gap:5px;}
.act-row{display:flex;gap:5px;}
.act-row .btn{flex:1;}
.transport-row{display:flex;gap:4px;}
.transport-btn{flex:1;border:1.5px solid var(--bdr);border-radius:8px;padding:5px 3px;background:var(--paper);cursor:pointer;text-align:center;font-size:.68rem;font-family:inherit;color:var(--mut);transition:all .15s;}
.transport-btn.active{border-color:var(--acc);background:var(--accL);color:var(--acc);font-weight:700;}
.leg-transport-btn{border:1.5px solid var(--bdr);border-radius:7px;padding:4px 7px;background:var(--paper);cursor:pointer;font-size:.78rem;font-family:inherit;color:var(--mut);transition:all .15s;display:inline-flex;align-items:center;justify-content:center;}

.map-area{position:relative;overflow:hidden;}

.theme-dots{display:flex;gap:3px;justify-content:center;margin-bottom:4px;}
.theme-dot{width:11px;height:11px;border-radius:50%;}

.lightbox-close{position:absolute;top:14px;right:18px;color:#fff;font-size:1.7rem;cursor:pointer;background:none;border:none;}

/* popup */
.popup-photos{display:flex;gap:5px;overflow-x:auto;margin-top:7px;scrollbar-width:none;padding-bottom:2px;}

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

// 裝置 ID：每台裝置自動產生一個唯一 ID 並存在 localStorage
function getDeviceId(){
  let id = localStorage.getItem('milu_device_id');
  if(!id){ id='dev_'+Date.now()+'_'+Math.random().toString(36).slice(2,8); localStorage.setItem('milu_device_id',id); }
  return id;
}

// 雲端存檔
window.cloudSave = async function(data){
  try{
    await setDoc(doc(db,'milu_users','shared_data'), { projects: data, updated: Date.now() });
    return true;
  }catch(e){ console.error('CloudSave error:',e); return false; }
};

// 雲端讀取
window.cloudLoad = async function(){
  try{
    const snap = await getDoc(doc(db,'milu_users','shared_data'));
    if(snap.exists()) return snap.data().projects;
    return null;
  }catch(e){ console.error('CloudLoad error:',e); return null; }
};

// 把 Storage 相關函式掛到 window，讓外部 script 可以存取
window.storageRef = (path) => ref(storage, path);
window.storageUpload = uploadBytes;
window.storageGetURL = getDownloadURL;
window.storageDelete = deleteObject;

window.firebaseReady = true;
// 通知主程式 Firebase 已就緒
document.dispatchEvent(new Event('firebaseReady'));
</script>

<script>
'use strict';

/* ===== 配色 ===== */
const THEMES=[
  {id:'th-greige', name:'灰白貓', dots:['#909088','#a0a098','#f4f2ee']},
  {id:'th-calico', name:'三花貓', dots:['#c07030','#8a7050','#fdf5ea']},
  {id:'th-morandi',name:'杏仁奶', dots:['#c8a888','#a89878','#fdf9f5']},
  {id:'th-blue',   name:'薄荷藍', dots:['#7aaac8','#8098b8','#f0f4fa']},
  {id:'th-green',  name:'薄荷綠', dots:['#8DBFAA','#70a890','#f0faf6']},
  {id:'th-purple', name:'薊紫',   dots:['#BEB6D9','#a098c0','#f8f5ff']},
  {id:'th-rose',   name:'櫻花粉', dots:['#E0A4AF','#c8a8b0','#fef4f6']},
  {id:'th-sand',   name:'杏桃',   dots:['#c05840','#984030','#fdf2ec']},
];
const DAY_COLORS=['#2c4a8c','#7a8f7e','#c07030','#7a6a4a','#8870a0','#9e6070','#6a8870','#8c6a2c'];
let curTheme='th-morandi';

function applyTheme(id){curTheme=id;document.body.className=id;lsSet('milu_theme',id);}
function buildThemeGrid(){
  document.getElementById('themeGrid').innerHTML=THEMES.map(t=>`
    <div class="theme-chip${t.id===curTheme?' sel':''}" style="background:${t.dots[2]};color:${t.dots[0]}" data-tid="${t.id}">
      <div class="theme-dots">${t.dots.slice(0,2).map(c=>`<div class="theme-dot" style="background:${c}"></div>`).join('')}</div>${t.name}
    </div>`).join('');
  document.getElementById('themeGrid').querySelectorAll('.theme-chip').forEach(el=>{
    el.addEventListener('click',()=>{applyTheme(el.dataset.tid);buildThemeGrid();});
  });
}
function buildHomeThemeDots(){
  document.getElementById('homeThemeRow').innerHTML=THEMES.map(t=>`
    <div class="theme-dot-btn${t.id===curTheme?' active':''}" style="background:${t.dots[0]}" title="${t.name}" data-tid="${t.id}"></div>`).join('');
  document.getElementById('homeThemeRow').querySelectorAll('.theme-dot-btn').forEach(el=>{
    el.addEventListener('click',()=>{applyTheme(el.dataset.tid);buildHomeThemeDots();});
  });
}

/* ===== localStorage ===== */
function lsGet(k){try{return localStorage.getItem(k);}catch{return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch{}}

/* ===== 照片壓縮 ===== */
async function uploadToStorage(file, maxW, maxH, q, path){
  try{
    // 先壓縮
    const blob = await new Promise(resolve=>{
      const img=new Image(), url=URL.createObjectURL(file);
      img.onload=()=>{
        let w=img.width, h=img.height;
        if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
        if(h>maxH){w=Math.round(w*maxH/h);h=maxH;}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        URL.revokeObjectURL(url);
        c.toBlob(b=>resolve(b),'image/jpeg',q||.65);
      };img.src=url;
    });
    // 上傳到 Firebase Storage（使用 window 上的函式）
    const sRef = window.storageRef(path);
    await window.storageUpload(sRef, blob, {contentType:'image/jpeg'});
    return await window.storageGetURL(sRef);
  }catch(e){
    console.error('uploadToStorage 失敗:', e);
    showToast('❌ 上傳失敗：' + e.message);
    return null;
  }
}
async function deleteFromStorage(url){
  if(!url || !url.startsWith('http')) return;
  if(!window.storageRef || !window.storageDelete){
    console.warn('Storage 尚未準備好，無法刪除');
    return;
  }
  try{
    const urlObj = new URL(url);
    const path = decodeURIComponent(urlObj.pathname.split('/o/')[1]);
    const sRef = window.storageRef(path);
    await window.storageDelete(sRef);
    console.log('Storage 刪除成功:', path);
  }catch(e){ console.warn('Storage 刪除失敗:', e.message); }
}

/* ===== 儲存（只在真的失敗時提示）===== */
let projects=[],curProjId=null;
function loadProjects(){
  // 先從 localStorage 快速載入（讓畫面馬上顯示）
  try{ projects=JSON.parse(localStorage.getItem('milu_projects')||'[]'); }
  catch{ projects=[]; }
  projects.forEach(p=>{if(!p.pool)p.pool=[];});
}

async function syncFromCloud(){
  if(!window.firebaseReady || !window.cloudLoad) return;
  try{
    showSyncStatus('<svg class="tab-icon" style="width:1em;height:1em" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M129.9 292.5C143.2 199.5 223.3 128 320 128C373 128 421 149.5 455.8 184.2C456 184.4 456.2 184.6 456.4 184.8L464 192L416.1 192C398.4 192 384.1 206.3 384.1 224C384.1 241.7 398.4 256 416.1 256L544.1 256C561.8 256 576.1 241.7 576.1 224L576.1 96C576.1 78.3 561.8 64 544.1 64C526.4 64 512.1 78.3 512.1 96L512.1 149.4L500.8 138.7C454.5 92.6 390.5 64 320 64C191 64 84.3 159.4 66.6 283.5C64.1 301 76.2 317.2 93.7 319.7C111.2 322.2 127.4 310 129.9 292.6zM573.4 356.5C575.9 339 563.7 322.8 546.3 320.3C528.9 317.8 512.6 330 510.1 347.4C496.8 440.4 416.7 511.9 320 511.9C267 511.9 219 490.4 184.2 455.7C184 455.5 183.8 455.3 183.6 455.1L176 447.9L223.9 447.9C241.6 447.9 255.9 433.6 255.9 415.9C255.9 398.2 241.6 383.9 223.9 383.9L96 384C87.5 384 79.3 387.4 73.3 393.5C67.3 399.6 63.9 407.7 64 416.3L65 543.3C65.1 561 79.6 575.2 97.3 575C115 574.8 129.2 560.4 129 542.7L128.6 491.2L139.3 501.3C185.6 547.4 249.5 576 320 576C449 576 555.7 480.6 573.4 356.5z"/></svg> 同步中...');
    const cloudData = await window.cloudLoad();
    if(!cloudData){ showSyncStatus(''); return; }
    // 比較雲端和本地，用較新的
    const localStr = localStorage.getItem('milu_projects')||'[]';
    const localData = JSON.parse(localStr);
    // 雲端有資料就用雲端（跨裝置同步）
    projects = cloudData;
    projects.forEach(p=>{if(!p.pool)p.pool=[];});
    localStorage.setItem('milu_projects', JSON.stringify(cloudData));
    renderHome();

function showSyncStatus(msg){
  let el = document.getElementById('syncStatus');
  if(!el){ el=document.createElement('div'); el.id='syncStatus'; el.style.cssText='position:fixed;top:60px;right:12px;background:var(--ink);color:var(--paper);padding:5px 12px;border-radius:20px;font-size:.72rem;z-index:500;transition:opacity .3s;'; document.body.appendChild(el); }

function getCurProj(){return projects.find(p=>p.id===curProjId)||null;}
function formatDate(dateStr){
  if(!dateStr)return '';
  const d=new Date(dateStr);
  return `${d.getMonth()+1}/${d.getDate()}`;
}
function formatDateFull(dateStr){
  if(!dateStr)return '';
  const d=new Date(dateStr);
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
}

async function delProject(id){
  if(!confirm('確定刪除此旅遊專案？'))return;
  const proj=projects.find(p=>p.id===id);
  if(proj){
    // 刪除 Storage 上的所有照片
    const toDelete=[];
    if(proj.cover) toDelete.push(proj.cover);
    if(proj.customIcon) toDelete.push(proj.customIcon);
    (proj.pool||[]).forEach(s=>(s.diary?.photos||[]).forEach(ph=>toDelete.push(ph)));
    proj.days.forEach(d=>d.spots.forEach(s=>(s.diary?.photos||[]).forEach(ph=>toDelete.push(ph))));
    await Promise.all(toDelete.map(url=>deleteFromStorage(url)));
  }
  projects=projects.filter(p=>p.id!==id);saveProjects();renderHome();
}
function openProject(id){
  curProjId=id;const proj=getCurProj();

  showPage('editPage');initMap();
  curDay=0;
  showPanelTab('pool');
  renderPool();renderTabs();renderSpots();updateCalcBtn();
  setTimeout(()=>{
    // 畫所有收藏窩的 marker
    proj.pool.forEach((s,i)=>{ if(s.lat!=null) addMarker(s,i+1,-1); });
    // 畫天數 marker
    proj.days.forEach((d,di)=>d.spots.forEach((s,si)=>{ if(s.lat!=null) addMarker(s,si+1,di); }));
    fitAll();
  },350);
}

/* ===== 標籤系統 ===== */
const PRESET_TAGS=['景點','餐廳','住宿','交通','購物','其他'];
let activeTagFilters=new Set(['all']); // 'all' 代表顯示全部


function toggleAddTag(btn){
  btn.classList.toggle('selected');
}
function getAddTags(){
  return Array.from(document.querySelectorAll('#addTagRow .tag-preset-btn.selected')).map(b=>b.dataset.tag);
}
function clearAddTags(){
  document.querySelectorAll('#addTagRow .tag-preset-btn').forEach(b=>b.classList.remove('selected'));
}

function getAllTags(){
  return [...PRESET_TAGS];
}

function renderTagFilter(){
  const row=document.getElementById('tagFilterRow');
  if(!row)return;
  const allTags=getAllTags();
  row.innerHTML=`<button class="tag-filter-btn all${activeTagFilters.has('all')?' active':''}" data-tag="all">全部</button>`+
    allTags.map(t=>`<button class="tag-filter-btn${activeTagFilters.has(t)?' active':''}" data-tag="${t}">${t}</button>`).join('');
  row.querySelectorAll('.tag-filter-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const tag=btn.dataset.tag;
      if(tag==='all'||activeTagFilters.has(tag)){
        // 點全部 或 點已選的標籤 → 回到全部
        activeTagFilters=new Set(['all']);
      }else{
        // 點其他標籤 → 單選
        activeTagFilters=new Set([tag]);
      }
      renderTagFilter();
      renderPool();
    });
  });
}

function spotMatchesFilter(spot){
  if(activeTagFilters.has('all'))return true;
  const tags=spot.tags||[];
  return [...activeTagFilters].some(t=>tags.includes(t));
}

function openTagEditor(spotId){
  const proj=getCurProj();
  const spot=proj.pool.find(s=>s.id===spotId);
  if(!spot)return;
  if(!spot.tags)spot.tags=[];
  // 找到對應的 tag-editor div 並顯示
  const editorId='tag-editor-'+spotId;
  let editor=document.getElementById(editorId);
  if(editor){
    editor.style.display=editor.style.display==='none'?'block':'none';
    return;
  }
}

function toggleSpotTag(spotId, tag){
  const proj=getCurProj();
  const spot=proj.pool.find(s=>s.id===spotId);
  if(!spot)return;
  if(!spot.tags)spot.tags=[];
  if(spot.tags.includes(tag)) spot.tags=spot.tags.filter(t=>t!==tag);
  else spot.tags.push(tag);
  renderTagFilter();
  renderPool();
  saveProjects();
}

function getSpotAssignedDays(spotId){
  const proj=getCurProj();if(!proj)return [];
  return proj.days.reduce((acc,d,i)=>{
    if(d.spots.some(s=>s.id===spotId))acc.push(i);
    return acc;
  },[]);
}
function getAssignedLabel(spotId){
  const days=getSpotAssignedDays(spotId);
  if(!days.length)return '';
  if(days.length===1)return `已排入 ${getCurProj().days[days[0]].label}`;
  return `已排入 ${days.length} 天`;
}

/* ===== 升級路線計算（Google Directions API）===== */
async function calcLegWithGoogle(s,e,mode){
  return new Promise((resolve)=>{
    if(!googleMapsReady||!google){resolve(null);return;}
    const modeMap={car:google.maps.TravelMode.DRIVING,transit:google.maps.TravelMode.TRANSIT,walk:google.maps.TravelMode.WALKING};
    const ds=new google.maps.DirectionsService();
    ds.route({
      origin:{lat:s.lat,lng:s.lng},
      destination:{lat:e.lat,lng:e.lng},
      travelMode:modeMap[mode]||google.maps.TravelMode.DRIVING,
      language:'zh-TW'
    },(result,status)=>{
      if(status===google.maps.DirectionsStatus.OK){
        const leg=result.routes[0].legs[0];
        resolve({
          distance:leg.distance.value,
          duration:leg.duration.value,
          distanceText:leg.distance.text,
          durationText:leg.duration.text,
          mode
        });
      }else{resolve(null);}
    });
  });
}

function calcPlaneDur(leg){
  if(!leg.planeFrom||!leg.planeTo)return leg;
  const [fh,fm]=leg.planeFrom.split(':').map(Number);
  const [th,tm]=leg.planeTo.split(':').map(Number);
  let diff=(th*60+tm)-(fh*60+fm);
  if(diff<0)diff+=24*60; // 跨夜
  const h=Math.floor(diff/60),m=diff%60;
  leg.planeDur=h>0?`${h}h${m}m`:`${m}分`;
  leg.duration=diff*60; // 秒，讓總計可以加入
  leg.distance=0;
  return leg;
}

  const val=document.getElementById('renameInput').value.trim();if(!val)return;
  const proj=getCurProj();
  const spot=proj.pool.find(s=>s.id===renamingPoolId);

  proj.days.forEach(d=>d.spots.forEach(s=>{if(s.id===renamingPoolId)s.name=val;}));

/* ===== 咪路排班 ===== */
function openAssignDialog(spotId){
  assigningSpotId=spotId;
  const proj=getCurProj();
  const spot=proj.pool.find(s=>s.id===spotId);
  if(!spot)return;
  document.getElementById('assignSpotName').innerHTML=`<svg style="width:0.85em;height:0.85em;vertical-align:middle;fill:var(--acc)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M128 252.6C128 148.4 214 64 320 64C426 64 512 148.4 512 252.6C512 371.9 391.8 514.9 341.6 569.4C329.8 582.2 310.1 582.2 298.3 569.4C248.1 514.9 127.9 371.9 127.9 252.6zM320 320C355.3 320 384 291.3 384 256C384 220.7 355.3 192 320 192C284.7 192 256 220.7 256 256C256 291.3 284.7 320 320 320z"/></svg> ${spot.name}`;
  document.getElementById('assignDayList').innerHTML=proj.days.map((d,i)=>`
    <button class="assign-day-btn" data-di="${i}">${d.label}（目前 ${d.spots.length} 個景點）</button>`).join('');
  document.getElementById('assignDayList').querySelectorAll('.assign-day-btn').forEach(btn=>{
    btn.addEventListener('click',()=>doAssign(parseInt(btn.dataset.di)));
  });
  openDlg('assignDlg');
}

function doAssign(dayIdx){
  const proj=getCurProj();
  const spot=proj.pool.find(s=>s.id===assigningSpotId);
  if(!spot){closeDlg('assignDlg');return;}
  // 從收藏窩複製到天數（保留原始資料）
  const daySpot={...spot,marker:null};
  proj.days[dayIdx].spots.push(daySpot);
  // 重新畫 marker（天數顏色）
  if(daySpot.lat!=null)addMarker(daySpot,proj.days[dayIdx].spots.length,dayIdx);
  // 收藏窩 marker 改回灰色（仍在池中）
  if(spot.lat!=null)addMarker(spot,proj.pool.indexOf(spot)+1,-1);
  closeDlg('assignDlg');
  renderPool();renderTabs();
  if(dayIdx===curDay)renderSpots();
  updateCalcBtn();saveProjects();
  showToast(`<svg class="tab-icon" style="width:0.85em;height:0.85em" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M320 576C178.6 576 64 461.4 64 320C64 178.6 178.6 64 320 64C461.4 64 576 178.6 576 320C576 461.4 461.4 576 320 576zM320 112C205.1 112 112 205.1 112 320C112 434.9 205.1 528 320 528C434.9 528 528 434.9 528 320C528 205.1 434.9 112 320 112zM390.7 233.9C398.5 223.2 413.5 220.8 424.2 228.6C434.9 236.4 437.3 251.4 429.5 262.1L307.4 430.1C303.3 435.8 296.9 439.4 289.9 439.9C282.9 440.4 276 437.9 271.1 433L215.2 377.1C205.8 367.7 205.8 352.5 215.2 343.2C224.6 333.9 239.8 333.8 249.1 343.2L285.1 379.2L390.7 234z"/></svg> 已加入 ${proj.days[dayIdx].label}：${spot.name}`);
  // 不自動跳 tab，只更新資料
  if(document.getElementById('daysPanel').classList.contains('active')){
    curDay=dayIdx;renderTabs();renderSpots();
  }
}

/* ===== 天數 ===== */
function renderTabs(){
  const proj=getCurProj();
  const scroll=document.getElementById('daysTabs');
  scroll.innerHTML=proj.days.map((d,i)=>`
    <button class="day-tab${i===curDay?' active':''}" data-di="${i}">
      ${d.label}<span class="day-tab-count">${d.spots.length}</span>
      ${proj.days.length>1?`<span class="day-tab-del" data-di="${i}">✕</span>`:''}
    </button>`).join('')+
    `<button class="day-tab-add" id="addDayTabBtn">＋</button>`;
  scroll.querySelectorAll('.day-tab').forEach(btn=>{
    btn.addEventListener('click',e=>{
      const del=e.target.closest('.day-tab-del');
      if(del){e.stopPropagation();delDay(parseInt(del.dataset.di));return;}
      switchDay(parseInt(btn.dataset.di));
    });
  });
  document.getElementById('addDayTabBtn').addEventListener('click',addDay);
}
function switchDay(i){curDay=i;renderTabs();renderSpots();updateCalcBtn();refreshAllMarkers();}
function addDay(){
  const proj=getCurProj();
  proj.days.push({label:`第 ${proj.days.length+1} 天`,spots:[],legs:null,legModes:[]});
  updateDayLabels(proj); // 有日期就自動算，沒有就用「第N天」
  curDay=proj.days.length-1;
  saveProjects();renderTabs();renderSpots();updateCalcBtn();

let dragSrc=null;

/* 手機觸控拖曳 */
function setupTouchDrag(list){
  const cards=()=>Array.from(list.querySelectorAll('.spot-card'));
  let touchDragIdx=null,placeholder=null,startY=0,origCard=null;

  list.querySelectorAll('.drag-hdl').forEach(hdl=>{
    hdl.addEventListener('touchstart',e=>{
      const card=hdl.closest('.spot-card');
      touchDragIdx=+card.dataset.idx;
      origCard=card;
      startY=e.touches[0].clientY;
      card.style.opacity='.4';
      e.preventDefault();
    },{passive:false});
  });

  list.addEventListener('touchmove',e=>{
    if(touchDragIdx===null)return;
    e.preventDefault();
    const y=e.touches[0].clientY;
    const all=cards();
    all.forEach(c=>c.classList.remove('drag-over'));
    let targetIdx=null;
    for(let c of all){
      const rect=c.getBoundingClientRect();
      if(y>=rect.top&&y<=rect.bottom){targetIdx=+c.dataset.idx;break;}
    }
    if(targetIdx!==null&&targetIdx!==touchDragIdx){
      all[targetIdx]?.classList.add('drag-over');
    }
    dragSrc=touchDragIdx;
  },{passive:false});

  list.addEventListener('touchend',e=>{
    if(touchDragIdx===null)return;
    if(origCard)origCard.style.opacity='';
    const y=e.changedTouches[0].clientY;
    const all=cards();
    let targetIdx=null;
    for(let c of all){
      const rect=c.getBoundingClientRect();
      if(y>=rect.top&&y<=rect.bottom){targetIdx=+c.dataset.idx;break;}
    }
    if(targetIdx!==null&&targetIdx!==touchDragIdx){
      const sp=getCurProj().days[curDay].spots;
      const[m]=sp.splice(touchDragIdx,1);sp.splice(targetIdx,0,m);
      getCurProj().days[curDay].legs=null;
      refreshAllMarkers();renderSpots();saveProjects();showToast('<svg class="tab-icon" style="width:0.85em;height:0.85em" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M320 576C178.6 576 64 461.4 64 320C64 178.6 178.6 64 320 64C461.4 64 576 178.6 576 320C576 461.4 461.4 576 320 576zM320 112C205.1 112 112 205.1 112 320C112 434.9 205.1 528 320 528C434.9 528 528 434.9 528 320C528 205.1 434.9 112 320 112zM390.7 233.9C398.5 223.2 413.5 220.8 424.2 228.6C434.9 236.4 437.3 251.4 429.5 262.1L307.4 430.1C303.3 435.8 296.9 439.4 289.9 439.9C282.9 440.4 276 437.9 271.1 433L215.2 377.1C205.8 367.7 205.8 352.5 215.2 343.2C224.6 333.9 239.8 333.8 249.1 343.2L285.1 379.2L390.7 234z"/></svg> 順序已調整');
    }else{
      all.forEach(c=>c.classList.remove('drag-over'));
    }
    touchDragIdx=null;origCard=null;dragSrc=null;
  });
}

function scrollToMap(){
  // 手機版才需要滾動，電腦版地圖一直看得到

    const mapEl=document.getElementById('map');
    if(mapEl){
      mapEl.scrollIntoView({behavior:'smooth',block:'start'});
    }
  }
}

function locSpot(i){
  const s=getCurProj().days[curDay].spots[i];if(s.lat==null)return;
  scrollToMap();
  leafMap.flyTo([s.lat,s.lng],15,{duration:.8});s.marker.openPopup();highlightCard(i);
}
function openNav(i){
  const s=getCurProj().days[curDay].spots[i];if(s.lat==null)return;
  const m={car:'driving',transit:'transit',walk:'walking'};
  // 用純座標定位，不受景點名稱影響
  const url=`https://maps.google.com/?q=${s.lat},${s.lng}`;
  const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}
function removeSpot(i){

  proj.days[curDay].legs=null;
  refreshAllMarkers();renderSpots();renderTabs();updateCalcBtn();saveProjects();

  renderPool(); // 更新收藏窩透明度

async function calcRoute(){
  const proj=getCurProj();
  const day=proj.days[curDay];
  const spots=day.spots.filter(s=>s.lat!=null);
  if(spots.length<2)return;
  const btn=document.getElementById('calcBtn');
  btn.innerHTML='<span class="spinner"></span>計算中…';btn.disabled=true;

  // 確保 legModes 存在
  if(!day.legModes)day.legModes=[];
  if(!day.legs)day.legs=[];

  try{
    // 逐段計算（每段依照各自的交通方式）
    let totalDist=0,totalDur=0,anyFailed=false;
    for(let i=0;i<spots.length-1;i++){
      const mode=day.legModes[i]||'car';
      const s=spots[i],e=spots[i+1];
      if(mode==='plane'){
        // 飛機：用已輸入的時間，不呼叫 API
        const existing=day.legs[i];
        if(existing&&existing.planeFrom&&existing.planeTo){
          totalDur+=(existing.duration||0);
          // 飛機不計距離
        }else{
          showToast('<svg class="tab-icon" style="width:0.85em;height:0.85em" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M320 64C334.7 64 348.2 72.1 355.2 85L571.2 485C577.9 497.4 577.6 512.4 570.4 524.5C563.2 536.6 550.1 544 536 544L104 544C89.9 544 76.8 536.6 69.6 524.5C62.4 512.4 62.1 497.4 68.8 485L284.8 85C291.8 72.1 305.3 64 320 64zM320 416C302.3 416 288 430.3 288 448C288 465.7 302.3 480 320 480C337.7 480 352 465.7 352 448C352 430.3 337.7 416 320 416zM320 224C301.8 224 287.3 239.5 288.6 257.7L296 361.7C296.9 374.2 307.4 384 319.9 384C332.5 384 342.9 374.3 343.8 361.7L351.2 257.7C352.5 239.5 338.1 224 319.8 224z"/></svg> 請先輸入飛機起飛和抵達時間');
        }
        continue;
      }
      try{
        let legData=null;
        if(googleMapsReady&&typeof calcLegWithGoogle==='function'){
          // 有 Google Maps API：大眾/步行/開車都用 Directions API
          legData=await calcLegWithGoogle(s,e,mode);
        }
        if(!legData){
          // Fallback：用 OSRM（只有開車）
          const res=await fetch(`https://router.project-osrm.org/route/v1/driving/${s.lng},${s.lat};${e.lng},${e.lat}?overview=false`);
          const data=await res.json();
          if(data.code!=='Ok')throw new Error();
          const leg=data.routes[0].legs[0];
          legData={distance:leg.distance,duration:leg.duration,mode};
        }
        day.legs[i]=legData;
        totalDist+=legData.distance||0;totalDur+=legData.duration||0;
      }catch{
        day.legs[i]=null;anyFailed=true;
      }
    }
    saveProjects();renderSpots();
    // 地圖顯示當天路線
    drawDayRoute(spots);
    const dist=(totalDist/1000).toFixed(1);
    const h=Math.floor(totalDur/3600),m=Math.floor((totalDur%3600)/60);
    const note=anyFailed?'（部分路段計算失敗）':'';
    showToast(`<svg class="tab-icon" style="width:0.85em;height:0.85em" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M320 576C178.6 576 64 461.4 64 320C64 178.6 178.6 64 320 64C461.4 64 576 178.6 576 320C576 461.4 461.4 576 320 576zM320 112C205.1 112 112 205.1 112 320C112 434.9 205.1 528 320 528C434.9 528 528 434.9 528 320C528 205.1 434.9 112 320 112zM390.7 233.9C398.5 223.2 413.5 220.8 424.2 228.6C434.9 236.4 437.3 251.4 429.5 262.1L307.4 430.1C303.3 435.8 296.9 439.4 289.9 439.9C282.9 440.4 276 437.9 271.1 433L215.2 377.1C205.8 367.7 205.8 352.5 215.2 343.2C224.6 333.9 239.8 333.8 249.1 343.2L285.1 379.2L390.7 234z"/></svg> 巡邏完成！總距離 ${dist}km，預估 ${h?h+'h ':''}${m}分${note}`);
  }catch{showToast('<svg class="tab-icon" style="width:0.85em;height:0.85em" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M183.1 137.4C170.6 124.9 150.3 124.9 137.8 137.4C125.3 149.9 125.3 170.2 137.8 182.7L275.2 320L137.9 457.4C125.4 469.9 125.4 490.2 137.9 502.7C150.4 515.2 170.7 515.2 183.2 502.7L320.5 365.3L457.9 502.6C470.4 515.1 490.7 515.1 503.2 502.6C515.7 490.1 515.7 469.8 503.2 457.3L365.8 320L503.1 182.6C515.6 170.1 515.6 149.8 503.1 137.3C490.6 124.8 470.3 124.8 457.8 137.3L320.5 274.7L183.1 137.4z"/></svg> 計算失敗，請確認網路連線');}
  btn.innerHTML='<svg class="tab-icon" style="width:1em;height:1em" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M241.1 580.2C222.4 598.9 192 598.9 173.2 580.2L60.1 467.1C41.4 448.4 41.4 418 60.1 399.2L77.1 382.2L150.6 455.7C160 465.1 175.2 465.1 184.5 455.7C193.8 446.3 193.9 431.1 184.5 421.8L111 348.3L144.9 314.4L195.8 365.3C205.2 374.7 220.4 374.7 229.7 365.3C239 355.9 239.1 340.7 229.7 331.4L178.8 280.5L212.7 246.6L286.2 320.1C295.6 329.5 310.8 329.5 320.1 320.1C329.4 310.7 329.5 295.5 320.1 286.2L246.6 212.7L280.5 178.8L331.4 229.7C340.8 239.1 356 239.1 365.3 229.7C374.6 220.3 374.7 205.1 365.3 195.8L314.4 144.9L348.3 111L421.8 184.5C431.2 193.9 446.4 193.9 455.7 184.5C465 175.1 465.1 159.9 455.7 150.6L382.2 77.1L399.2 60.1C417.9 41.4 448.3 41.4 467.1 60.1L580.5 172.9C599.2 191.6 599.2 222 580.5 240.8L241.1 580.2z"/></svg> 咪路巡邏';btn.disabled=false;
}


/* ===== 地圖顯示當天路線 ===== */
let dayRouteLine=null;
function drawDayRoute(spots){
  if(dayRouteLine){leafMap.removeLayer(dayRouteLine);dayRouteLine=null;}
  const validSpots=spots.filter(s=>s.lat!=null);
  if(validSpots.length<2)return;
  const c=DAY_COLORS[curDay%DAY_COLORS.length];
  const latlngs=validSpots.map(s=>[s.lat,s.lng]);
  dayRouteLine=L.polyline(latlngs,{color:c,weight:3.5,opacity:.8,dashArray:'8,6'}).addTo(leafMap);
  // 手機版需要先 invalidateSize 再 fitBounds
  setTimeout(()=>{
    leafMap.invalidateSize();
    leafMap.fitBounds(L.latLngBounds(latlngs),{padding:[40,40]});
  },100);
}

/* ===== 日期選單 ===== */
function initDatePicker(dateStr){
  const now=new Date();
  const curY=dateStr?parseInt(dateStr.split('-')[0]):now.getFullYear();
  const curM=dateStr?parseInt(dateStr.split('-')[1]):now.getMonth()+1;
  const curD=dateStr?parseInt(dateStr.split('-')[2]):now.getDate();

  const ySel=document.getElementById('dateYear');
  const mSel=document.getElementById('dateMonth');
  const dSel=document.getElementById('dateDay');
  if(!ySel)return;

  // 年：前1年到後5年
  ySel.innerHTML='<option value="">年</option>'+
    Array.from({length:7},(_,i)=>now.getFullYear()-1+i).map(y=>`<option value="${y}"${y===curY?' selected':''}>${y}</option>`).join('');

  // 月
  mSel.innerHTML='<option value="">月</option>'+
    Array.from({length:12},(_,i)=>i+1).map(m=>`<option value="${m}"${m===curM?' selected':''}>${m}</option>`).join('');

  // 日
  updateDayOptions(curY,curM,curD);

  ySel.addEventListener('change',()=>updateDayOptions(+ySel.value,+mSel.value,+dSel.value));
  mSel.addEventListener('change',()=>updateDayOptions(+ySel.value,+mSel.value,+dSel.value));
}

function updateDayOptions(y,m,d){
  const dSel=document.getElementById('dateDay');
  if(!dSel)return;
  const daysInMonth=y&&m?new Date(y,m,0).getDate():31;
  dSel.innerHTML='<option value="">日</option>'+
    Array.from({length:daysInMonth},(_,i)=>i+1).map(n=>`<option value="${n}"${n===d?' selected':''}>${n}</option>`).join('');
}

function getDatePickerValue(){
  const y=document.getElementById('dateYear')?.value;
  const m=document.getElementById('dateMonth')?.value;
  const d=document.getElementById('dateDay')?.value;
  if(!y||!m||!d)return '';
  return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

function updateDayLabels(proj){
  if(!proj.startDate){
    // 沒有日期就用「第 N 天」
    proj.days.forEach((d,i)=>d.label=`第 ${i+1} 天`);
    return;
  }
  const start=new Date(proj.startDate);
  const weekdays=['日','一','二','三','四','五','六'];
  proj.days.forEach((d,i)=>{
    const date=new Date(start);
    date.setDate(start.getDate()+i);
    const m=date.getMonth()+1;
    const day=date.getDate();
    const w=weekdays[date.getDay()];
    d.label=`${m}/${day}（${w}）`;
  });
}

    refreshAllMarkers();saveProjects();showToast('<svg class="tab-icon" style="width:0.85em;height:0.85em" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M232.7 69.9C237.1 56.8 249.3 48 263.1 48L377 48C390.8 48 403 56.8 407.4 69.9L416 96L512 96C529.7 96 544 110.3 544 128C544 145.7 529.7 160 512 160L128 160C110.3 160 96 145.7 96 128C96 110.3 110.3 96 128 96L224 96L232.7 69.9zM128 208L512 208L512 512C512 547.3 483.3 576 448 576L192 576C156.7 576 128 547.3 128 512L128 208zM216 272C202.7 272 192 282.7 192 296L192 488C192 501.3 202.7 512 216 512C229.3 512 240 501.3 240 488L240 296C240 282.7 229.3 272 216 272zM320 272C306.7 272 296 282.7 296 296L296 488C296 501.3 306.7 512 320 512C333.3 512 344 501.3 344 488L344 296C344 282.7 333.3 272 320 272zM424 272C410.7 272 400 282.7 400 296L400 488C400 501.3 410.7 512 424 512C437.3 512 448 501.3 448 488L448 296C448 282.7 437.3 272 424 272z"/></svg> 自訂圖示已刪除');
  });
  document.getElementById('projSaveBtn').addEventListener('click',async()=>{ await saveProj(); });
  document.getElementById('openThemeBtn').addEventListener('click',()=>{buildThemeGrid();openDlg('themeDlg');});
  document.getElementById('themeCloseBtn').addEventListener('click',()=>closeDlg('themeDlg'));

  // Panel tabs
  document.getElementById('tabPool').addEventListener('click',()=>{
    showPanelTab('pool');
    renderTagFilter();
  });
  document.getElementById('tabDays').addEventListener('click',()=>showPanelTab('days'));

  // 收藏窩
  document.getElementById('addToPoolBtn').addEventListener('click',addToPool);
  document.getElementById('fName').addEventListener('keydown',e=>{if(e.key==='Enter')addToPool();});

  // 地圖 dialog
  document.getElementById('mapDlgCancel').addEventListener('click',()=>closeDlg('mapDlg'));
  document.getElementById('mapDlgConfirm').addEventListener('click',addToPoolFromMap);
  document.getElementById('dlgName').addEventListener('keydown',e=>{if(e.key==='Enter')addToPoolFromMap();});

  // 咪路排班
  document.getElementById('assignCancel').addEventListener('click',()=>closeDlg('assignDlg'));

  // 修改名稱
  document.getElementById('renameCancelBtn').addEventListener('click',()=>closeDlg('renameSpotDlg'));
  document.getElementById('renameConfirmBtn').addEventListener('click',confirmRename);
  document.getElementById('renameInput').addEventListener('keydown',e=>{if(e.key==='Enter')confirmRename();});

  // 計算路程
  document.getElementById('calcBtn').addEventListener('click',calcRoute);
  document.getElementById('clearDayBtn').addEventListener('click',()=>{
    const proj=getCurProj();
    proj.days[curDay].spots.forEach(s=>{if(s.marker)leafMap.removeLayer(s.marker);});
    proj.days[curDay].spots=[];proj.days[curDay].legs=null;
    refreshAllMarkers();renderSpots();renderTabs();updateCalcBtn();renderPool();saveProjects();
  renderPool(); // 更新收藏窩透明度showToast('<svg class="tab-icon" style="width:0.85em;height:0.85em" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M320 576C178.6 576 64 461.4 64 320C64 178.6 178.6 64 320 64C461.4 64 576 178.6 576 320C576 461.4 461.4 576 320 576zM320 112C205.1 112 112 205.1 112 320C112 434.9 205.1 528 320 528C434.9 528 528 434.9 528 320C528 205.1 434.9 112 320 112zM390.7 233.9C398.5 223.2 413.5 220.8 424.2 228.6C434.9 236.4 437.3 251.4 429.5 262.1L307.4 430.1C303.3 435.8 296.9 439.4 289.9 439.9C282.9 440.4 276 437.9 271.1 433L215.2 377.1C205.8 367.7 205.8 352.5 215.2 343.2C224.6 333.9 239.8 333.8 249.1 343.2L285.1 379.2L390.7 234z"/></svg> 已清除本天');
  });
  document.getElementById('clearAllBtn').addEventListener('click',()=>{
    const proj=getCurProj();
    proj.days.forEach(d=>d.spots.forEach(s=>{if(s.marker)leafMap.removeLayer(s.marker);}));
    proj.days=[{label:'第 1 天',spots:[],legs:null,legModes:[]}];curDay=0;
    renderTabs();renderSpots();updateCalcBtn();renderPool();saveProjects();showToast('<svg class="tab-icon" style="width:0.85em;height:0.85em" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M320 576C178.6 576 64 461.4 64 320C64 178.6 178.6 64 320 64C461.4 64 576 178.6 576 320C576 461.4 461.4 576 320 576zM320 112C205.1 112 112 205.1 112 320C112 434.9 205.1 528 320 528C434.9 528 528 434.9 528 320C528 205.1 434.9 112 320 112zM390.7 233.9C398.5 223.2 413.5 220.8 424.2 228.6C434.9 236.4 437.3 251.4 429.5 262.1L307.4 430.1C303.3 435.8 296.9 439.4 289.9 439.9C282.9 440.4 276 437.9 271.1 433L215.2 377.1C205.8 367.7 205.8 352.5 215.2 343.2C224.6 333.9 239.8 333.8 249.1 343.2L285.1 379.2L390.7 234z"/></svg> 已清除全部天數');
  });


  // lightbox
  document.getElementById('lightboxClose').addEventListener('click',closeLightbox);
  document.getElementById('lightbox').addEventListener('click',e=>{if(e.target===document.getElementById('lightbox'))closeLightbox();});

  // overlay 背景關閉
  // 用 mousedown 記錄起點，只有起點和終點都在 overlay 才關閉（避免文字選取誤關）
  document.querySelectorAll('.overlay').forEach(o=>{
    let downOnOverlay=false;
    o.addEventListener('mousedown',e=>{downOnOverlay=(e.target===o);});
    o.addEventListener('mouseup',e=>{if(downOnOverlay&&e.target===o)o.classList.remove('open');downOnOverlay=false;});
    // 手機 touch 支援
    o.addEventListener('touchstart',e=>{downOnOverlay=(e.target===o);},{passive:true});
    o.addEventListener('touchend',e=>{if(downOnOverlay&&e.target===o)o.classList.remove('open');downOnOverlay=false;});
  });
});
</script>
</body>
</html>
